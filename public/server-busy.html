<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Antrean Server — G-English</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 1.25rem; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc; color: #0f172a;
        }
        .card {
            width: 100%; max-width: 440px; background: #ffffff; border-radius: 1.25rem;
            border: 1px solid rgba(10, 66, 130, 0.14);
            box-shadow: 0 18px 40px -12px rgba(10, 66, 130, 0.16);
            overflow: hidden; text-align: center;
        }
        .bar { height: 6px; background: linear-gradient(90deg, #0a4282, #fbb900, #0a4282); }
        .body { padding: 2rem 1.65rem; }
        .badge {
            display: inline-block; padding: 0.28rem 0.85rem; border-radius: 9999px;
            background: #fbb900; color: #0a4282; font-size: 0.72rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.85rem;
        }
        h1 { margin: 0 0 0.55rem 0; font-size: 1.35rem; font-weight: 800; color: #0a4282; }
        p { margin: 0 0 1.25rem 0; font-size: 0.92rem; line-height: 1.55; color: #475569; }
        .spinner {
            width: 2.75rem; height: 2.75rem; margin: 0 auto 1.1rem auto; border-radius: 9999px;
            border: 3px solid rgba(10, 66, 130, 0.15); border-top-color: #0a4282;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .timer {
            display: inline-block; padding: 0.45rem 1rem; border-radius: 9999px;
            background: rgba(10, 66, 130, 0.07); color: #0a4282; font-weight: 800;
            font-size: 0.86rem; font-variant-numeric: tabular-nums; margin-bottom: 1.25rem;
        }
        .btn {
            display: inline-block; width: 100%; padding: 0.8rem 1.25rem; border-radius: 9999px;
            background: #0a4282; color: #ffffff; font-weight: 700; font-size: 0.9rem;
            border: none; cursor: pointer; text-decoration: none;
        }
        .btn:hover { background: #0d52a0; }
        .note { margin-top: 1rem; font-size: 0.76rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="card">
        <div class="bar"></div>
        <div class="body">
            <div class="spinner" aria-hidden="true"></div>
            <span class="badge">Antrean Masuk Otomatis</span>
            <h1>Server Ujian Sedang Ramai</h1>
            <p>
                Banyak peserta sedang mengakses secara bersamaan. Tenang, data Anda tetap aman — halaman akan masuk kembali secara otomatis.
            </p>
            <div class="timer">Mencoba ulang dalam <span id="sec">5</span> detik...</div>
            <button type="button" class="btn" onclick="window.location.reload()">Coba Masuk Sekarang</button>
            <div class="note">G-English Course &amp; CBT • Jangan tutup tab ujian Anda</div>
        </div>
    </div>
    <script>
        (function () {
            var left = 3 + Math.floor(Math.random() * 5); // 3-7s random jitter to prevent stampede
            var el = document.getElementById('sec');
            if (el) el.textContent = left;
            var t = setInterval(function () {
                left--;
                if (left <= 0) {
                    clearInterval(t);
                    window.location.reload();
                } else if (el) {
                    el.textContent = left;
                }
            }, 1000);
        })();
    </script>
</body>
</html>
